<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>개미와 배짱이 - 활동 사진</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #fdfaf6;
            background-image: url('data:image/svg+xml;utf8,<svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"><path d="M20 20.5V18H0v-2h20v-2.5L35 20z" fill="%23f4ebd8" fill-opacity="0.3" fill-rule="evenodd"/></svg>');
        }
        .jua-font {
            font-family: 'Jua', sans-serif;
        }
        .photo-card {
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }
        .photo-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px -6px rgba(0, 0, 0, 0.12);
        }
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        /* Hide Netlify badge aggressively */
        #netlify-badge, .netlify-badge, a[href*="netlify.com/"] {
            display: none !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }
    </style>
</head>
<body class="text-gray-800 antialiased min-h-screen flex flex-col">

    <!-- Top Navigation -->
    <header class="bg-white/80 backdrop-blur-md sticky top-0 z-40 border-b border-amber-100 shadow-xs">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
            <a href="index.html" class="flex items-center space-x-2 text-amber-900 font-bold text-lg hover:opacity-80 transition">
                <span class="text-2xl">🐜</span>
                <span class="jua-font text-xl text-amber-900 tracking-tight">개미와 배짱이</span>
                <span class="text-2xl">🎻</span>
            </a>
            <div class="flex items-center space-x-2">
                <a href="index.html#application-form" class="inline-flex items-center text-sm font-semibold text-white bg-amber-500 hover:bg-amber-600 px-4 py-2 rounded-xl transition shadow-sm jua-font">
                    <span>📝 신청하기</span>
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-5xl mx-auto px-4 sm:px-6 py-8 sm:py-12 w-full">
        <!-- Header -->
        <div class="text-center max-w-xl mx-auto mb-8">
            <h1 class="text-3xl sm:text-4xl font-extrabold text-amber-950 mb-2 jua-font tracking-tight">
                활동 사진 📸
            </h1>
            <p class="text-gray-500 text-sm sm:text-base">
                개미반 & 베짱이반 모임 사진
            </p>
        </div>

        <!-- Filter Tabs -->
        <div class="flex justify-center mb-8">
            <div class="inline-flex p-1 bg-amber-100/70 rounded-2xl border border-amber-200/80 gap-1">
                <button onclick="setTab('all')" id="tab-all" class="tab-btn px-4 py-2 rounded-xl text-sm font-bold transition-all bg-white text-amber-900 shadow-xs">
                    전체 <span class="ml-1 text-xs opacity-80">9</span>
                </button>
                <button onclick="setTab('ant')" id="tab-ant" class="tab-btn px-4 py-2 rounded-xl text-sm font-bold transition-all text-gray-600 hover:text-amber-800">
                    🐜 개미반 <span class="ml-1 text-xs opacity-80">5</span>
                </button>
                <button onclick="setTab('grasshopper')" id="tab-grasshopper" class="tab-btn px-4 py-2 rounded-xl text-sm font-bold transition-all text-gray-600 hover:text-green-800">
                    🎻 베짱이반 <span class="ml-1 text-xs opacity-80">4</span>
                </button>
            </div>
        </div>

        <!-- Photo Grid -->
        <div id="photos-grid" class="grid grid-cols-2 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6">

            <!-- 1. Ant 1 -->
            <div class="photo-item photo-card bg-white rounded-2xl overflow-hidden border border-gray-100 shadow-xs cursor-pointer group" data-category="ant" onclick="openLightbox(0)">
                <div class="relative overflow-hidden aspect-[4/3] bg-gray-100">
                    <img src="images/ant/ant_1.jpg" alt="개미반 카공 스터디" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" loading="lazy">
                </div>
                <div class="p-3 sm:p-4 flex items-center justify-between">
                    <span class="text-xs sm:text-sm font-bold text-gray-800">개미반 카공</span>
                    <span class="text-xs bg-amber-50 text-amber-800 font-semibold px-2 py-0.5 rounded-md border border-amber-200/60">🐜 개미반</span>
                </div>
            </div>

            <!-- 2. Ant 2 -->
            <div class="photo-item photo-card bg-white rounded-2xl overflow-hidden border border-gray-100 shadow-xs cursor-pointer group" data-category="ant" onclick="openLightbox(1)">
                <div class="relative overflow-hidden aspect-[4/3] bg-gray-100">
                    <img src="images/ant/ant_2.jpg" alt="개미반 단체 스터디" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" loading="lazy">
                </div>
                <div class="p-3 sm:p-4 flex items-center justify-between">
                    <span class="text-xs sm:text-sm font-bold text-gray-800">단체 스터디</span>
                    <span class="text-xs bg-amber-50 text-amber-800 font-semibold px-2 py-0.5 rounded-md border border-amber-200/60">🐜 개미반</span>
                </div>
            </div>

            <!-- 3. Ant 3 -->
            <div class="photo-item photo-card bg-white rounded-2xl overflow-hidden border border-gray-100 shadow-xs cursor-pointer group" data-category="ant" onclick="openLightbox(2)">
                <div class="relative overflow-hidden aspect-[4/3] bg-gray-100">
                    <img src="images/ant/ant_3.jpg" alt="개미반 자료 스터디" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" loading="lazy">
                </div>
                <div class="p-3 sm:p-4 flex items-center justify-between">
                    <span class="text-xs sm:text-sm font-bold text-gray-800">자료 분석 & 스터디</span>
                    <span class="text-xs bg-amber-50 text-amber-800 font-semibold px-2 py-0.5 rounded-md border border-amber-200/60">🐜 개미반</span>
                </div>
            </div>

            <!-- 4. Ant 4 -->
            <div class="photo-item photo-card bg-white rounded-2xl overflow-hidden border border-gray-100 shadow-xs cursor-pointer group" data-category="ant" onclick="openLightbox(3)">
                <div class="relative overflow-hidden aspect-[4/3] bg-gray-100">
                    <img src="images/ant/ant_4.jpg" alt="개미반 집중 카공" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" loading="lazy">
                </div>
                <div class="p-3 sm:p-4 flex items-center justify-between">
                    <span class="text-xs sm:text-sm font-bold text-gray-800">원형 테이블 스터디</span>
                    <span class="text-xs bg-amber-50 text-amber-800 font-semibold px-2 py-0.5 rounded-md border border-amber-200/60">🐜 개미반</span>
                </div>
            </div>

            <!-- 5. Ant 5 -->
            <div class="photo-item photo-card bg-white rounded-2xl overflow-hidden border border-gray-100 shadow-xs cursor-pointer group" data-category="ant" onclick="openLightbox(4)">
                <div class="relative overflow-hidden aspect-[4/3] bg-gray-100">
                    <img src="images/ant/ant_5.jpg" alt="개미반 노트북 작업" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" loading="lazy">
                </div>
                <div class="p-3 sm:p-4 flex items-center justify-between">
                    <span class="text-xs sm:text-sm font-bold text-gray-800">노트북 작업</span>
                    <span class="text-xs bg-amber-50 text-amber-800 font-semibold px-2 py-0.5 rounded-md border border-amber-200/60">🐜 개미반</span>
                </div>
            </div>

            <!-- 6. Grasshopper 1 -->
            <div class="photo-item photo-card bg-white rounded-2xl overflow-hidden border border-gray-100 shadow-xs cursor-pointer group" data-category="grasshopper" onclick="openLightbox(5)">
                <div class="relative overflow-hidden aspect-[4/3] bg-gray-100">
                    <img src="images/grasshopper/grasshopper_1.jpg" alt="베짱이반 베이커리 카페 카공" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" loading="lazy">
                </div>
                <div class="p-3 sm:p-4 flex items-center justify-between">
                    <span class="text-xs sm:text-sm font-bold text-gray-800">베이커리 카페 카공</span>
                    <span class="text-xs bg-green-50 text-green-800 font-semibold px-2 py-0.5 rounded-md border border-green-200/60">🎻 베짱이반</span>
                </div>
            </div>

            <!-- 7. Grasshopper 2 -->
            <div class="photo-item photo-card bg-white rounded-2xl overflow-hidden border border-gray-100 shadow-xs cursor-pointer group" data-category="grasshopper" onclick="openLightbox(6)">
                <div class="relative overflow-hidden aspect-[4/3] bg-gray-100">
                    <img src="images/grasshopper/grasshopper_2.jpg" alt="베짱이반 디저트 & 스터디" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" loading="lazy">
                </div>
                <div class="p-3 sm:p-4 flex items-center justify-between">
                    <span class="text-xs sm:text-sm font-bold text-gray-800">디저트 & 스터디</span>
                    <span class="text-xs bg-green-50 text-green-800 font-semibold px-2 py-0.5 rounded-md border border-green-200/60">🎻 베짱이반</span>
                </div>
            </div>

            <!-- 8. Grasshopper 3 -->
            <div class="photo-item photo-card bg-white rounded-2xl overflow-hidden border border-gray-100 shadow-xs cursor-pointer group" data-category="grasshopper" onclick="openLightbox(7)">
                <div class="relative overflow-hidden aspect-[4/3] bg-gray-100">
                    <img src="images/grasshopper/grasshopper_3.jpg" alt="베짱이반 스터디 뒷풀이" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" loading="lazy">
                </div>
                <div class="p-3 sm:p-4 flex items-center justify-between">
                    <span class="text-xs sm:text-sm font-bold text-gray-800">스터디 뒷풀이</span>
                    <span class="text-xs bg-green-50 text-green-800 font-semibold px-2 py-0.5 rounded-md border border-green-200/60">🎻 베짱이반</span>
                </div>
            </div>

            <!-- 9. Grasshopper 4 -->
            <div class="photo-item photo-card bg-white rounded-2xl overflow-hidden border border-gray-100 shadow-xs cursor-pointer group" data-category="grasshopper" onclick="openLightbox(8)">
                <div class="relative overflow-hidden aspect-[4/3] bg-gray-100">
                    <img src="images/grasshopper/grasshopper_4.jpg" alt="베짱이반 식사 모임" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" loading="lazy">
                </div>
                <div class="p-3 sm:p-4 flex items-center justify-between">
                    <span class="text-xs sm:text-sm font-bold text-gray-800">함박스테이크 식사</span>
                    <span class="text-xs bg-green-50 text-green-800 font-semibold px-2 py-0.5 rounded-md border border-green-200/60">🎻 베짱이반</span>
                </div>
            </div>

        </div>

        <!-- Bottom CTA -->
        <div class="mt-14 mb-6 text-center">
            <a href="index.html#application-form" class="inline-flex items-center gap-2 bg-amber-500 hover:bg-amber-600 active:scale-95 text-white font-bold py-3.5 px-8 rounded-2xl shadow-md transition jua-font text-base sm:text-lg">
                <span>📝 스터디 신청하기</span>
            </a>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white/60 border-t border-amber-100 py-6 text-center text-xs text-gray-400">
        <p>© 개미와 배짱이 자격증 스터디</p>
    </footer>

    <!-- Lightbox Modal -->
    <div id="lightbox" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-xs hidden flex items-center justify-center p-4" onclick="closeLightbox()">
        <div class="relative max-w-3xl w-full flex flex-col items-center" onclick="event.stopPropagation()">
            <!-- Close button -->
            <button onclick="closeLightbox()" class="absolute -top-10 right-0 text-white/80 hover:text-white text-2xl font-bold p-2 transition">
                ✕
            </button>
            
            <!-- Main Image -->
            <div class="relative w-full flex items-center justify-center max-h-[78vh]">
                <img id="lightbox-img" src="" alt="" class="max-h-[78vh] max-w-full rounded-2xl object-contain shadow-2xl">
                
                <button onclick="prevPhoto()" class="absolute left-2 top-1/2 -translate-y-1/2 bg-black/40 hover:bg-black/70 text-white rounded-full w-10 h-10 flex items-center justify-center text-xl transition">
                    ‹
                </button>
                <button onclick="nextPhoto()" class="absolute right-2 top-1/2 -translate-y-1/2 bg-black/40 hover:bg-black/70 text-white rounded-full w-10 h-10 flex items-center justify-center text-xl transition">
                    ›
                </button>
            </div>

            <!-- Minimal Caption -->
            <div class="mt-3 flex items-center justify-between w-full max-w-md px-2 text-white text-sm">
                <span id="lightbox-title" class="font-bold"></span>
                <span id="lightbox-counter" class="text-xs text-gray-400">1 / 9</span>
            </div>
        </div>
    </div>

    <script>
        const photos = [
            { src: "images/ant/ant_1.jpg", title: "개미반 카공", category: "ant" },
            { src: "images/ant/ant_2.jpg", title: "단체 스터디", category: "ant" },
            { src: "images/ant/ant_3.jpg", title: "자료 분석 & 스터디", category: "ant" },
            { src: "images/ant/ant_4.jpg", title: "원형 테이블 스터디", category: "ant" },
            { src: "images/ant/ant_5.jpg", title: "노트북 작업", category: "ant" },
            { src: "images/grasshopper/grasshopper_1.jpg", title: "베이커리 카페 카공", category: "grasshopper" },
            { src: "images/grasshopper/grasshopper_2.jpg", title: "디저트 & 스터디", category: "grasshopper" },
            { src: "images/grasshopper/grasshopper_3.jpg", title: "스터디 뒷풀이", category: "grasshopper" },
            { src: "images/grasshopper/grasshopper_4.jpg", title: "함박스테이크 식사", category: "grasshopper" }
        ];

        let activePhotoIndices = photos.map((_, i) => i);
        let currentPhotoIndex = 0;

        function setTab(category) {
            const tabAll = document.getElementById('tab-all');
            const tabAnt = document.getElementById('tab-ant');
            const tabGrasshopper = document.getElementById('tab-grasshopper');

            [tabAll, tabAnt, tabGrasshopper].forEach(btn => {
                btn.className = "tab-btn px-4 py-2 rounded-xl text-sm font-bold transition-all text-gray-600 hover:text-amber-900";
            });

            const photoCards = document.querySelectorAll('.photo-item');

            if (category === 'all') {
                tabAll.className = "tab-btn px-4 py-2 rounded-xl text-sm font-bold transition-all bg-white text-amber-900 shadow-xs";
                photoCards.forEach(card => card.classList.remove('hidden'));
                activePhotoIndices = photos.map((_, i) => i);
            } else if (category === 'ant') {
                tabAnt.className = "tab-btn px-4 py-2 rounded-xl text-sm font-bold transition-all bg-white text-amber-900 shadow-xs";
                activePhotoIndices = [];
                photoCards.forEach((card, idx) => {
                    if (card.getAttribute('data-category') === 'ant') {
                        card.classList.remove('hidden');
                        activePhotoIndices.push(idx);
                    } else {
                        card.classList.add('hidden');
                    }
                });
            } else if (category === 'grasshopper') {
                tabGrasshopper.className = "tab-btn px-4 py-2 rounded-xl text-sm font-bold transition-all bg-white text-green-800 shadow-xs";
                activePhotoIndices = [];
                photoCards.forEach((card, idx) => {
                    if (card.getAttribute('data-category') === 'grasshopper') {
                        card.classList.remove('hidden');
                        activePhotoIndices.push(idx);
                    } else {
                        card.classList.add('hidden');
                    }
                });
            }
        }

        function openLightbox(index) {
            currentPhotoIndex = index;
            updateLightboxContent();
            document.getElementById('lightbox').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        function updateLightboxContent() {
            const photo = photos[currentPhotoIndex];
            if (!photo) return;
            document.getElementById('lightbox-img').src = photo.src;
            document.getElementById('lightbox-title').innerText = photo.title;

            const currentPos = activePhotoIndices.indexOf(currentPhotoIndex);
            if (currentPos !== -1) {
                document.getElementById('lightbox-counter').innerText = `${currentPos + 1} / ${activePhotoIndices.length}`;
            } else {
                document.getElementById('lightbox-counter').innerText = `${currentPhotoIndex + 1} / ${photos.length}`;
            }
        }

        function prevPhoto() {
            if (activePhotoIndices.length === 0) return;
            let currentPos = activePhotoIndices.indexOf(currentPhotoIndex);
            if (currentPos === -1) currentPos = 0;
            const prevPos = (currentPos - 1 + activePhotoIndices.length) % activePhotoIndices.length;
            currentPhotoIndex = activePhotoIndices[prevPos];
            updateLightboxContent();
        }

        function nextPhoto() {
            if (activePhotoIndices.length === 0) return;
            let currentPos = activePhotoIndices.indexOf(currentPhotoIndex);
            if (currentPos === -1) currentPos = 0;
            const nextPos = (currentPos + 1) % activePhotoIndices.length;
            currentPhotoIndex = activePhotoIndices[nextPos];
            updateLightboxContent();
        }

        document.addEventListener('keydown', (e) => {
            const lightbox = document.getElementById('lightbox');
            if (lightbox.classList.contains('hidden')) return;

            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowLeft') prevPhoto();
            if (e.key === 'ArrowRight') nextPhoto();
        });
    </script>
</body>
</html>
